# Builds the React app and publishes the ready-to-serve files (dist/) to the
# `deploy` branch. Hostinger's plain Git deployment can then pull that branch
# straight into public_html — no Node.js needed on the server.
name: Build & publish deploy branch

on:
  push:
    branches: [main, claude/project-management-system-dg3cxo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
